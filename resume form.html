<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Resume</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#071c15;
    color:white;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:30px 18px 50px;
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.header h1{
    margin:0;
    font-size:30px;
}

.header p{
    color:#a9c9bd;
    margin-top:8px;
}

.form-card{
    background:#0b2920;
    border:1px solid #21463a;
    border-radius:16px;
    padding:28px;
}

.section{
    margin-bottom:28px;
}

.section h2{
    color:#69d6a3;
    font-size:19px;
    border-bottom:1px solid #31594c;
    padding-bottom:8px;
    margin-bottom:18px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.field.full{
    grid-column:1/-1;
}

label{
    font-size:13px;
    font-weight:bold;
    color:#d7eee5;
}

input,
textarea{
    width:100%;
    border:1px solid #3a6255;
    background:#102f26;
    color:white;
    border-radius:8px;
    padding:12px;
    font-size:14px;
    outline:none;
}

input:focus,
textarea:focus{
    border-color:#69d6a3;
}

textarea{
    min-height:90px;
    resize:vertical;
}

.photo-preview{
    width:110px;
    height:110px;
    border:2px dashed #69d6a3;
    border-radius:8px;
    margin-top:8px;
    display:none;
    overflow:hidden;
}

.photo-preview img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:25px;
}

button{
    border:0;
    padding:13px 25px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    font-size:14px;
}

.generate{
    background:#69d6a3;
    color:#082219;
}

.back{
    background:#193b31;
    color:white;
}

@media(max-width:700px){

    .grid{
        grid-template-columns:1fr;
    }

    .form-card{
        padding:18px;
    }

    .buttons{
        flex-direction:column;
    }

    button{
        width:100%;
    }

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>Create Your Resume</h1>

<p>Fill your information and generate your professional resume.</p>

</div>


<form class="form-card" id="resumeForm">


<!-- PERSONAL INFORMATION -->

<div class="section">

<h2>👤 Personal Information</h2>

<div class="grid">

<div class="field">
<label>Student Name</label>
<input type="text" id="name" placeholder="Adesh Mokate">
</div>

<div class="field">
<label>Age</label>
<input type="number" id="age" placeholder="19">
</div>

<div class="field">
<label>Profession / Career Title</label>
<input type="text" id="profession" placeholder="Electrical Engineering Diploma">
</div>

<div class="field">
<label>Email</label>
<input type="email" id="email" placeholder="your@email.com">
</div>

<div class="field">
<label>Phone Number</label>
<input type="text" id="phone" placeholder="+91 XXXXX XXXXX">
</div>

<div class="field">
<label>City, State, Zip Code</label>
<input type="text" id="address" placeholder="Ahilyanagar, Maharashtra">
</div>

<div class="field">
<label>LinkedIn Profile URL</label>
<input type="text" id="linkedin" placeholder="linkedin.com/in/yourname">
</div>

<div class="field">
<label>Portfolio / GitHub URL</label>
<input type="text" id="portfolio" placeholder="github.com/yourname">
</div>

<div class="field full">

<label>Profile Picture</label>

<input type="file" id="photo" accept="image/*">

<div class="photo-preview" id="photoPreview">

<img id="previewImage">

</div>

</div>

</div>

</div>


<!-- SUMMARY -->

<div class="section">

<h2>👤 Professional Summary</h2>

<div class="field">

<label>Professional Summary / Career Objective</label>

<textarea id="summary"
placeholder="Write your 2-3 sentence professional summary or career objective..."></textarea>

</div>

</div>


<!-- EXPERIENCE -->

<div class="section">

<h2>💼 Work Experience</h2>

<h3>Experience 1</h3>

<div class="grid">

<div class="field">
<label>Job Title / Position</label>
<input type="text" id="experienceTitle1">
</div>

<div class="field">
<label>Company Name</label>
<input type="text" id="company1">
</div>

<div class="field">
<label>City, State</label>
<input type="text" id="experienceLocation1">
</div>

<div class="field">
<label>Start Date</label>
<input type="text" id="experienceStart1" placeholder="Jan 2026">
</div>

<div class="field">
<label>End Date / Present</label>
<input type="text" id="experienceEnd1" placeholder="Present">
</div>

<div class="field full">
<label>Job Responsibilities / Achievements</label>
<textarea id="experience1"
placeholder="Write each responsibility on a new line."></textarea>
</div>

</div>


<h3>Experience 2</h3>

<div class="grid">

<div class="field">
<label>Job Title / Position</label>
<input type="text" id="experienceTitle2">
</div>

<div class="field">
<label>Company Name</label>
<input type="text" id="company2">
</div>

<div class="field">
<label>City, State</label>
<input type="text" id="experienceLocation2">
</div>

<div class="field">
<label>Start Date</label>
<input type="text" id="experienceStart2">
</div>

<div class="field">
<label>End Date</label>
<input type="text" id="experienceEnd2">
</div>

<div class="field full">
<label>Job Responsibilities / Achievements</label>
<textarea id="experience2"></textarea>
</div>

</div>

</div>


<!-- EDUCATION -->

<div class="section">

<h2>🎓 Education</h2>

<div class="grid">

<div class="field">
<label>Degree Name / Major</label>
<input type="text" id="education">
</div>

<div class="field">
<label>College / University Name</label>
<input type="text" id="college">
</div>

<div class="field">
<label>City, State</label>
<input type="text" id="educationLocation">
</div>

<div class="field">
<label>Graduation Year</label>
<input type="text" id="educationYear">
</div>

<div class="field">
<label>GPA / Percentage</label>
<input type="text" id="grade">
</div>

<div class="field">
<label>Relevant Coursework / Honors</label>
<input type="text" id="coursework">
</div>

</div>

</div>


<!-- HIGHER EDUCATION -->

<div class="section">

<h2>📚 Higher Secondary / Diploma</h2>

<div class="grid">

<div class="field">
<label>Higher Secondary / Diploma</label>
<input type="text" id="higherEducation">
</div>

<div class="field">
<label>School / College Name</label>
<input type="text" id="higherCollege">
</div>

<div class="field">
<label>City, State</label>
<input type="text" id="higherLocation">
</div>

<div class="field">
<label>Passing Year</label>
<input type="text" id="higherYear">
</div>

<div class="field">
<label>Percentage / Grade</label>
<input type="text" id="higherGrade">
</div>

</div>

</div>


<!-- SKILLS -->

<div class="section">

<h2>⭐ Key Skills</h2>

<div class="grid">

<div class="field">
<label>Technical Skills</label>
<textarea id="technicalSkills"
placeholder="HTML, CSS, JavaScript, Java"></textarea>
</div>

<div class="field">
<label>Soft Skills</label>
<textarea id="softSkills"
placeholder="Communication, Teamwork, Problem Solving"></textarea>
</div>

<div class="field full">
<label>Tools & Software</label>
<textarea id="tools"
placeholder="GitHub, VS Code, AWS"></textarea>
</div>

</div>

</div>


<!-- PROJECT -->

<div class="section">

<h2>📁 Projects</h2>

<div class="grid">

<div class="field">
<label>Project Title</label>
<input type="text" id="projectName">
</div>

<div class="field">
<label>Month / Year</label>
<input type="text" id="projectDate">
</div>

<div class="field full">
<label>Description</label>
<textarea id="project"></textarea>
</div>

<div class="field">
<label>Technologies Used</label>
<textarea id="projectTech"></textarea>
</div>

<div class="field">
<label>Contribution</label>
<textarea id="contribution"></textarea>
</div>

</div>

</div>


<!-- CERTIFICATIONS -->

<div class="section">

<h2>🏆 Certifications & Awards</h2>

<div class="grid">

<div class="field">
<label>Certification Name</label>
<input type="text" id="certification">
</div>

<div class="field">
<label>Issuing Organization</label>
<input type="text" id="certOrganization">
</div>

<div class="field">
<label>Certification Year</label>
<input type="text" id="certYear">
</div>

<div class="field">
<label>Award / Recognition</label>
<input type="text" id="award">
</div>

<div class="field">
<label>Award Organization</label>
<input type="text" id="awardOrganization">
</div>

<div class="field">
<label>Award Year</label>
<input type="text" id="awardYear">
</div>

<div class="field full">
<label>Additional Certification Details</label>
<textarea id="certDetails"></textarea>
</div>

</div>

</div>


<!-- PERSONAL DETAILS -->

<div class="section">

<h2>👤 Personal Details</h2>

<div class="grid">

<div class="field">
<label>Languages Known</label>
<input type="text" id="languages"
placeholder="English, Hindi, Marathi">
</div>

<div class="field">
<label>Hobbies</label>
<input type="text" id="hobbies"
placeholder="Coding, Content Writing">
</div>

</div>

</div>


<div class="buttons">

<button type="button" class="back"
onclick="goDashboard()">
← Back to Dashboard
</button>

<button type="submit" class="generate">
Generate Resume →
</button>

</div>

</form>

</div>


<script>

/* PHOTO PREVIEW */

document.getElementById("photo").addEventListener("change",function(){

const file=this.files[0];

if(!file) return;

const reader=new FileReader();

reader.onload=function(e){

document.getElementById("previewImage").src=e.target.result;

document.getElementById("photoPreview").style.display="block";

};

reader.readAsDataURL(file);

});


/* LOAD OLD DATA WHEN EDITING */

document.addEventListener("DOMContentLoaded",function(){

const saved=localStorage.getItem("resumeData");

if(saved){

try{

const data=JSON.parse(saved);

const fields=[
"name",
"age",
"profession",
"email",
"phone",
"address",
"linkedin",
"portfolio",
"summary",
"experienceTitle1",
"company1",
"experienceLocation1",
"experienceStart1",
"experienceEnd1",
"experience1",
"experienceTitle2",
"company2",
"experienceLocation2",
"experienceStart2",
"experienceEnd2",
"experience2",
"education",
"college",
"educationLocation",
"educationYear",
"grade",
"coursework",
"higherEducation",
"higherCollege",
"higherLocation",
"higherYear",
"higherGrade",
"technicalSkills",
"softSkills",
"tools",
"projectName",
"projectDate",
"project",
"projectTech",
"contribution",
"certification",
"certOrganization",
"certYear",
"award",
"awardOrganization",
"awardYear",
"certDetails",
"languages",
"hobbies"
];

fields.forEach(function(id){

const element=document.getElementById(id);

if(element && data[id] !== undefined){

element.value=data[id];

}

});


}catch(error){

console.log("Could not load old resume data.");

}

}


/* LOAD OLD PHOTO */

const oldPhoto=localStorage.getItem("resumePhoto");

if(oldPhoto){

document.getElementById("previewImage").src=oldPhoto;

document.getElementById("photoPreview").style.display="block";

}

});


/* SAVE RESUME */

document.getElementById("resumeForm").addEventListener("submit",function(e){

e.preventDefault();

const ids=[
"name",
"age",
"profession",
"email",
"phone",
"address",
"linkedin",
"portfolio",
"summary",
"experienceTitle1",
"company1",
"experienceLocation1",
"experienceStart1",
"experienceEnd1",
"experience1",
"experienceTitle2",
"company2",
"experienceLocation2",
"experienceStart2",
"experienceEnd2",
"experience2",
"education",
"college",
"educationLocation",
"educationYear",
"grade",
"coursework",
"higherEducation",
"higherCollege",
"higherLocation",
"higherYear",
"higherGrade",
"technicalSkills",
"softSkills",
"tools",
"projectName",
"projectDate",
"project",
"projectTech",
"contribution",
"certification",
"certOrganization",
"certYear",
"award",
"awardOrganization",
"awardYear",
"certDetails",
"languages",
"hobbies"
];

const data={};

ids.forEach(function(id){

const element=document.getElementById(id);

data[id]=element ? element.value.trim() : "";

});

localStorage.setItem(
"resumeData",
JSON.stringify(data)
);


/* SAVE PHOTO */

const photoInput=document.getElementById("photo");

if(photoInput.files.length>0){

const reader=new FileReader();

reader.onload=function(e){

localStorage.setItem(
"resumePhoto",
e.target.result
);

window.location.href="resume.html";

};

reader.readAsDataURL(photoInput.files[0]);

}else{

window.location.href="resume.html";

}

});


/* DASHBOARD */

function goDashboard(){

window.location.href="dashboard.html";

}

</script>

</body>
</html>
