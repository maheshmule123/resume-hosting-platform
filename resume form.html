<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Resume</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
}

.header{
    background:#1f4e79;
    color:white;
    text-align:center;
    padding:22px;
}

.container{
    width:90%;
    max-width:800px;
    margin:30px auto;
    background:white;
    padding:30px;
    box-sizing:border-box;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
}

.group{
    margin-bottom:20px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}

input,
textarea{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:15px;
}

textarea{
    min-height:90px;
    resize:vertical;
}

.buttons{
    text-align:center;
}

button{
    padding:14px 30px;
    margin:8px;
    background:#1f4e79;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="header">

<h1>Create Your Resume</h1>

<p>Fill Your Information</p>

</div>

<div class="container">

<form id="resumeForm">

<div class="group">
<label>Student Name</label>
<input
type="text"
id="name"
placeholder="Enter your full name"
required>
</div>

<div class="group">
<label>Address</label>
<textarea
id="address"
placeholder="Enter your address"
required></textarea>
</div>

<div class="group">
<label>Email</label>
<input
type="email"
id="email"
placeholder="Enter your email"
required>
</div>

<div class="group">
<label>Profile Picture</label>
<input
type="file"
id="photo"
accept="image/*"
required>
</div>

<div class="group">
<label>Qualification</label>
<textarea
id="qualification"
placeholder="Enter your qualification"
required></textarea>
</div>

<div class="group">
<label>Skills</label>
<textarea
id="skills"
placeholder="HTML, CSS, JavaScript, Python, Java, SQL..."
required></textarea>
</div>

<div class="group">
<label>Experience</label>
<textarea
id="experience"
placeholder="Enter your experience or write Fresher"
required></textarea>
</div>

<div class="group">
<label>Projects</label>
<textarea
id="projects"
placeholder="Enter your project details"
required></textarea>
</div>

<div class="group">
<label>Certificates</label>
<textarea
id="certificates"
placeholder="Enter your certificates"
required></textarea>
</div>

<div class="buttons">

<button type="submit">
Generate Resume
</button>

<button
type="button"
onclick="location.href='dashboard.html'">
Back to Dashboard
</button>

</div>

</form>

</div>

<script>

document.getElementById("resumeForm")
.addEventListener("submit",function(event){

    event.preventDefault();

    const photo =
    document.getElementById("photo").files[0];

    if(!photo){

        alert("Please select a profile picture.");
        return;

    }

    localStorage.setItem(
        "studentName",
        document.getElementById("name").value.trim()
    );

    localStorage.setitem(
          "studentmobilename",
          document.getElementById("mobilenumber").value.trim()
    );
    localStorage.setItem(
        "address",
        document.getElementById("address").value.trim()
    );

    localStorage.setItem(
        "email",
        document.getElementById("email").value.trim()
    );

    localStorage.setItem(
        "qualification",
        document.getElementById("qualification").value.trim()
    );

    localStorage.setItem(
        "skills",
        document.getElementById("skills").value.trim()
    );

    localStorage.setItem(
        "experience",
        document.getElementById("experience").value.trim()
    );

    localStorage.setItem(
        "projects",
        document.getElementById("projects").value.trim()
    );

    localStorage.setItem(
        "certificates",
        document.getElementById("certificates").value.trim()
    );


    const reader =
    new FileReader();

    reader.onload=function(){

        localStorage.setItem(
            "profilePhoto",
            reader.result
        );

        localStorage.setItem(
            "resumeCreated",
            "true"
        );

        window.location.href=
        "resume.html";

    };

    reader.readAsDataURL(photo);

});

</script>

</body>
</html>
