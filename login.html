<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Resume Builder</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
}

.box{
    width:90%;
    max-width:420px;
    margin:80px auto;
    padding:30px;
    box-sizing:border-box;
    background:white;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    color:#1f4e79;
}

label{
    display:block;
    margin-top:20px;
    margin-bottom:7px;
    font-weight:bold;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:15px;
}

button{
    width:100%;
    margin-top:25px;
    padding:13px;
    border:none;
    border-radius:7px;
    background:#1f4e79;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#163a5c;
}

button:disabled{
    background:#999;
    cursor:not-allowed;
}

.register{
    text-align:center;
    margin-top:20px;
}

.register a{
    color:#1f4e79;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="box">

<h1>Login</h1>

<form id="loginForm">

<label>Email</label>

<input
    type="email"
    id="email"
    placeholder="Enter your email"
    required
>

<label>Password</label>

<input
    type="password"
    id="password"
    placeholder="Enter your password"
    required
>

<button type="submit" id="loginButton">
Login
</button>

</form>

<div class="register">
Don't have an account?
<a href="register.html">Register</a>
</div>

</div>

<script>

const API_URL =
"https://f5ycsa1wi2.execute-api.ap-south-1.amazonaws.com/prod/login";


document.getElementById("loginForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const loginButton =
        document.getElementById("loginButton");

    loginButton.disabled = true;
    loginButton.innerText = "Logging in...";

    try {

        console.log("Calling Login API...");
        console.log("API:", API_URL);

        const response = await fetch(
            API_URL,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email: email,
                    password: password
                })
            }
        );

        console.log("Status:", response.status);

        const text = await response.text();

        console.log("Raw Response:", text);

        let data;

        try {
            data = JSON.parse(text);
        }
        catch(parseError) {

            throw new Error(
                "Invalid server response: " + text
            );

        }


        if(response.ok){

            localStorage.setItem(
                "loggedIn",
                "true"
            );

            localStorage.setItem(
                "loggedInEmail",
                data.email || email
            );

            localStorage.setItem(
                "userId",
                data.userid || ""
            );

            localStorage.setItem(
                "userName",
                data.name || ""
            );

            alert("Login Successful!");

            window.location.href =
                "dashbord.html";

        }
        else{

            alert(
                data.message ||
                "Invalid email or password!"
            );

        }

    }

    catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );

        alert(
            "Login API Error: " +
            error.message
        );

    }

    finally {

        loginButton.disabled = false;
        loginButton.innerText = "Login";

    }

});

</script>

</body>
</html>
