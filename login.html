<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Resume Builder</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
}

.box{
    width:90%;
    max-width:420px;
    margin:80px auto;
    padding:30px;
    box-sizing:border-box;
    background:white;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    color:#1f4e79;
}

label{
    display:block;
    margin-top:20px;
    margin-bottom:7px;
    font-weight:bold;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:15px;
}

button{
    width:100%;
    margin-top:25px;
    padding:13px;
    border:none;
    border-radius:7px;
    background:#1f4e79;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#163a5c;
}

.register{
    text-align:center;
    margin-top:20px;
}

.register a{
    color:#1f4e79;
    font-weight:bold;
}
</style>

</head>

<body>

<div class="box">

<h1>Login</h1>

<form id="loginForm">

<label>Email</label>

<input
    type="email"
    id="email"
    placeholder="Enter your email"
    required
>

<label>Password</label>

<input
    type="password"
    id="password"
    placeholder="Enter your password"
    required
>

<button type="submit">
Login
</button>

</form>

<div class="register">
Don't have an account?
<a href="register.html">Register</a>
</div>

</div>


<script>

document.getElementById("loginForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    // Get registered user
    const userData =
        localStorage.getItem("resumeBuilderUser");


    // Account not found
    if(!userData){

        alert("Account not found! Please register first.");

        return;
    }


    const user =
        JSON.parse(userData);


    // Check email and password
    if(
        email === user.email &&
        password === user.password
    ){

        // Login information
        localStorage.setItem(
            "loggedIn",
            "true"
        );

        localStorage.setItem(
            "loggedInEmail",
            user.email
        );

        localStorage.setItem(
            "userName",
            user.name
        );


        alert("Login Successful!");


        // Dashboard
        window.location.href =
            "dashbord.html";

    }
    else{

        alert("Invalid email or password!");

    }

});

</script>

</body>
</html>
