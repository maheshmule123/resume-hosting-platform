<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard - Resume Builder</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    text-align:center;
}

.container{
    width:90%;
    max-width:700px;
    margin:70px auto;
    padding:35px;
    background:white;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
}

.logo{
    font-size:50px;
}

h1{
    color:#1f4e79;
}

.welcome{
    font-size:22px;
    font-weight:bold;
}

.description{
    color:#666;
}

button{
    display:block;
    width:80%;
    max-width:400px;
    margin:15px auto;
    padding:14px;
    border:0;
    border-radius:8px;
    background:#1f4e79;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#163a5c;
}

.logout{
    background:#777;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">📄</div>

    <h1>Dashboard</h1>

    <p class="welcome" id="welcomeUser">
        Welcome to Resume Builder! 👋
    </p>

    <p class="description">
        Create and manage your professional resume.
    </p>

    <button onclick="createResume()">
        📝 Create Resume
    </button>

    <button onclick="viewResume()">
        👁️ View Resume
    </button>

    <button class="logout" onclick="logout()">
        🚪 Logout
    </button>

</div>

<script>

const user = JSON.parse(
    localStorage.getItem("resumeBuilderUser")
);

if(user){

    document.getElementById("welcomeUser").textContent =
        "Welcome, " + user.name + "! 👋";

}


function createResume(){
    window.location.href = "resume%20form.html";

}


function viewResume(){

    if(localStorage.getItem("resumeCreated") === "true"){

        window.location.href = "resume form.html";

    }else{

        alert("Please create your resume first.");

    }

}


function logout(){

    localStorage.removeItem("loggedIn");
    localStorage.removeItem("loggedInEmail");

    window.location.href = "index.html";

}

</script>

</body>
</html>
