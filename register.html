<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account</title><link rel="stylesheet" href="style.css"></head><body><main class="auth"><section class="authVisual"><div class="eyebrow">Step 01 · Account</div><h1>Start building your professional profile.</h1><p>Create your account once, then manage your resume from a clean dashboard.</p></section><section class="formSide"><div class="card"><h2>Create account</h2><p class="muted">Use demo details for your college project.</p><form onsubmit="registerHandler(event)"><div class="field"><label>Full name</label><input id="nameEl" required placeholder="Mahesh"></div><div class="field"><label>Email</label><input id="regEmail" type="email" required placeholder="you@example.com"></div><div class="split"><div class="field"><label>Password</label><input id="regPassword" type="password" required></div><div class="field"><label>Confirm</label><input id="confirmPassword" type="password" required></div></div><button class="btn primary full" type="submit">Create account</button></form><p class="muted">Already registered? <a href="login.html"><b>Sign in</b></a></p></div></section></main><script src="app.js"></script></body></html>
