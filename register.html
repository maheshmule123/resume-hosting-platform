<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Create Account</title><link rel="stylesheet" href="style.css"></head><body><main class="auth-page"><section class="auth-visual"><div><span class="eyebrow" style="color:#dce7fb">01 / Create account</span><h1>Start with a clean profile.</h1><p>Register once and keep your resume data ready to edit, preview and download.</p></div></section><section class="auth-card-wrap"><div class="auth-card"><h2>Create account</h2><p class="sub">Enter your details to continue to Mahesh Resume Builder.</p><form id="registerForm"><div class="field"><label>Name</label><input id="name" required placeholder="Mahesh"></div><div class="field"><label>Email</label><input id="email" type="email" required placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" required placeholder="Minimum 6 characters"></div><div class="field"><label>Confirm password</label><input id="confirmPassword" type="password" required placeholder="Re-enter password"></div><button class="btn btn-primary full">Create account</button></form><div class="helper">Already have an account? <a href="login.html">Sign in</a></div></div></section></main><script src="script.js"></script></body></html>
