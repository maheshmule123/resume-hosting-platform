<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Resume</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#e9eef5;
}

.resume{
    width:90%;
    max-width:850px;
    margin:30px auto;
    background:white;
    padding:35px;
    box-sizing:border-box;
    box-shadow:0 4px 20px rgba(0,0,0,.15);
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:3px solid #1f4e79;
    padding-bottom:20px;
}

.info h1{
    margin:0 0 10px;
    color:#1f4e79;
    font-size:32px;
}

.info p{
    margin:6px 0;
    font-size:15px;
}

.photo{
    width:130px;
    height:130px;
    object-fit:cover;
    border:3px solid #1f4e79;
    border-radius:5px;
}

.section{
    margin-top:22px;
}

.section h2{
    color:#1f4e79;
    font-size:20px;
    border-bottom:1px solid #ccc;
    padding-bottom:6px;
    margin-bottom:10px;
}

.section p{
    white-space:pre-line;
    line-height:1.6;
    margin:0;
}

.buttons{
    text-align:center;
    margin:25px auto;
}

button{
    padding:13px 28px;
    margin:7px;
    border:none;
    border-radius:8px;
    background:#1f4e79;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#163a5c;
}

@media(max-width:600px){
    .resume{
        padding:20px;
    }

    .top{
        align-items:flex-start;
    }

    .info h1{
        font-size:24px;
    }

    .photo{
        width:90px;
        height:90px;
    }
}

@media print{

    body{
        background:white;
    }

    .resume{
        width:100%;
        margin:0;
        padding:20px;
        box-shadow:none;
    }

    .buttons{
        display:none;
    }
}
</style>
</head>

<body>

<div class="resume" id="resume">

    <div class="top">

        <div class="info">
            <h1 id="studentName"></h1>

            <p id="address"></p>

            <p id="email"></p>
        </div>

        <img id="profilePhoto"
             class="photo"
             alt="Profile Picture">

    </div>


    <div class="section">
        <h2>Qualification</h2>
        <p id="qualification"></p>
    </div>


    <div class="section">
        <h2>Skills</h2>
        <p id="skills"></p>
    </div>


    <div class="section">
        <h2>Experience</h2>
        <p id="experience"></p>
    </div>


    <div class="section">
        <h2>Projects</h2>
        <p id="projects"></p>
    </div>


    <div class="section">
        <h2>Certificates</h2>
        <p id="certificates"></p>
    </div>

</div>


<div class="buttons">

    <button onclick="downloadPDF()">
        Download
    </button>

    <button onclick="goDashboard()">
        Back to Dashboard
    </button>

</div>


<script>

function getData(key){
    return localStorage.getItem(key) || "";
}


// Display resume data

document.getElementById("studentName").textContent =
    getData("studentName");

document.getElementById("address").textContent =
    getData("address");

document.getElementById("email").textContent =
    getData("email");

document.getElementById("qualification").textContent =
    getData("qualification");

document.getElementById("skills").textContent =
    getData("skills");

document.getElementById("experience").textContent =
    getData("experience");

document.getElementById("projects").textContent =
    getData("projects");

document.getElementById("certificates").textContent =
    getData("certificates");


// Display profile photo

const photo = localStorage.getItem("profilePhoto");

if(photo){
    document.getElementById("profilePhoto").src = photo;
}


// Download / Save as PDF

function downloadPDF(){

    window.print();

}


// Back to Dashboard

function goDashboard(){

    window.location.href = "dashboard.html";

}

</script>

</body>
</html>
