<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Resume - Resume Builder</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="logo">📄</div>

        <h1>Create Resume</h1>

        <p class="description">
            Fill in your details to create your professional resume.
        </p>

        <form id="resumeForm">

            <input type="text"
                   id="resumeName"
                   placeholder="Enter your Full Name"
                   required>

            <input type="text"
                   id="profile"
                   placeholder="Enter your Profile"
                   required>

            <input type="text"
                   id="education"
                   placeholder="Enter your Education"
                   required>

            <input type="text"
                   id="skills"
                   placeholder="Enter your Skills"
                   required>

            <input type="text"
                   id="projects"
                   placeholder="Enter your Projects"
                   required>

            <input type="text"
                   id="experience"
                   placeholder="Enter your Experience"
                   required>

            <input type="text"
                   id="certifications"
                   placeholder="Enter your Certifications"
                   required>

            <button type="submit" class="login-btn">
                👀 Generate Resume
            </button>

        </form>

        <br>

        <button class="google-btn" onclick="backToDashboard()">
            ← Back to Dashboard
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
