<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Preview - Resume Builder</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="resume-preview">

        <header class="resume-header">
            <h1 id="previewName">Your Name</h1>
            <p id="previewContact"></p>
        </header>

        <section>
            <h2>Profile</h2>
            <p id="previewprofile"></p>
        </section>

        <section>
            <h2>Education</h2>
            <p id="previewEducation"></p>
        </section>

        <section>
            <h2>Skills</h2>
            <p id="previewSkills"></p>
        </section>

        <section>
            <h2>Projects</h2>
            <p id="previewProjects"></p>
        </section>

        <section>
            <h2>Experience</h2>
            <p id="previewExperience"></p>
        </section>

        <section>
            <h2>Certifications</h2>
            <p id="previewCertifications"></p>
        </section>

        <div class="preview-buttons">
            <button onclick="downloadPDF()" class="login-btn">
                📥 Download PDF
            </button>

            <button onclick="backToBuilder()" class="google-btn">
                ✏️ Edit Resume
            </button>

            <button onclick="backToDashboard()" class="google-btn">
                ← Dashboard
            </button>
        </div>

    </div>

    <script src="script.js"></script>

    <script>
        loadResumePreview();
    </script>

</body>
</html>
